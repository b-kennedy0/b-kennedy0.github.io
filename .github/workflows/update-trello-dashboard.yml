name: Update Trello Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 8-17 * * 1-5"

permissions:
  contents: write

concurrency:
  group: update-trello-dashboard
  cancel-in-progress: true

jobs:
  time-window:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.window.outputs.should_run }}
    steps:
      - name: Check London working hours
        id: window
        run: |
          day="$(TZ=Europe/London date +%u)"
          hour="$(TZ=Europe/London date +%H)"
          minute="$(TZ=Europe/London date +%M)"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$day" -le 5 ] && { [ "$hour" -ge 9 ] && [ "$hour" -lt 17 ] || { [ "$hour" -eq 17 ] && [ "$minute" -eq 00 ]; }; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: time-window
    if: needs.time-window.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test Trello metrics
        run: node --test scripts/trello-metrics.test.mjs

      - name: Fetch Trello metrics
        env:
          TRELLO_KEY: ${{ secrets.TRELLO_KEY }}
          TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
          TRELLO_BOARD_ID: ${{ secrets.TRELLO_BOARD_ID }}
          TRELLO_DASHBOARD_TIMEZONE: Europe/London
        run: node scripts/update-trello-metrics.mjs data/trello-metrics.json

      - name: Commit updated metrics
        run: |
          if git diff --quiet -- data/trello-metrics.json; then
            echo "No Trello metrics changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trello-metrics.json
          git commit -m "Update Trello dashboard metrics"
          git push
